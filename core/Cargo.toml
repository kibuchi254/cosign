[package]
name = "cosign-core"
version = "0.1.0"
edition = "2024"
description = "Cosign core: policy engine, mandates, state machines, audit chain and the only PayPal executor"

[lib]
name = "cosign_core"
path = "src/lib.rs"

[[bin]]
name = "cosign-core"
path = "src/main.rs"

[[bin]]
name = "cosign-spike"
path = "src/bin/spike.rs"

[dependencies]
anyhow = "1"
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json", "migrate", "macros"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
http-body-util = "0.1"
proptest = "1"
tower = { version = "0.5", features = ["util"] }
