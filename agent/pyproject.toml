[project]
name = "cosign-agent"
version = "0.1.0"
description = "Cosign agent service: reads invoices, flags injection, asks the Rust core for a decision. Holds no PayPal secret."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "httpx>=0.27",
    "pypdf>=4.0",
    # Local OCR for photos and scanned PDFs: no vision model or API needed.
    "rapidocr>=3.0",
    "onnxruntime>=1.18",
    "pypdfium2>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "Pillow>=10"]
mcp = ["mcp>=1.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cosign_agent*", "evals*"]
